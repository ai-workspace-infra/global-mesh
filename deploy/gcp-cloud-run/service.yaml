apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: global-mesh-api
  namespace: xworktech
  labels:
    cloud.googleapis.com/location: us-central1
    app: global-mesh
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/xworktech/global-mesh-api:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: supabase-db-credentials
                  key: connection_string
